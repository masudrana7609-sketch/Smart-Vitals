# Mosquitto for Smart Vitals: logins required, and each login may use only its own topics (acl).
listener 1883
allow_anonymous false
password_file /mosquitto/run/passwd
acl_file /mosquitto/run/acl

# Messages held for a subscriber that is busy or reconnecting. Mosquitto's default (1000) silently DROPS the
# rest: a burst of 3000 readings lost about 2000 of them in testing (Sprint 4). 200000 covers roughly two
# hours of 30 patients at 60x speed, or about 4.5 days of 30 real patients at one reading a minute.
max_queued_messages 200000
max_queued_bytes 0

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
