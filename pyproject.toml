# Tool configuration only. This project is not a pip-installable package.

[tool.ruff]
target-version = "py313"
line-length = 120          # matches the starter notebook's style
extend-exclude = ["dashboard/node_modules", "models", "*.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes: unused imports, undefined names
    "I",        # import sorting
    "B",        # bugbear: likely bugs
    "UP",       # newer Python syntax
    "S",        # bandit: security checks (hard-coded secrets, unsafe calls)
    "SIM",      # simplifications
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]  # the normal FastAPI pattern

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]       # assert is how pytest works; test-only secrets
# The starter notebook has deliberate ___ blanks and a long setup cell; notebooks import src/ after setting the path
"notebooks/**" = ["F821", "F841", "E501", "E702", "E402", "S101", "B023", "I001", "SIM102"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    # Starlette asks for httpx2 in future; httpx still works for the TestClient
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:`BrokerSysPlugin`:DeprecationWarning",  # amqtt, the test-only broker
]
